  <title id="title">Momento atual</title>
  <desc id="desc">Desenhando interfaces mais silenciosas com presença mais forte.</desc>
  <rect width="1200" height="180" fill="#050505"/>
  <rect x="1" y="1" width="1198" height="178" stroke="#1C1C1C" stroke-width="2"/>
