<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Focus areas</title>
  <desc id="desc">Four focus areas: interface, motion, brand, and delivery.</desc>
  <rect width="1200" height="260" fill="#050505"/>
  <rect x="1" y="1" width="1198" height="258" stroke="#1C1C1C" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="57" fill="#777" font-size="12" letter-spacing="4">SELECTED FOCUS</text>
    <g>
      <rect x="64" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="88" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Interface</text>
      <text x="88" y="160" fill="#A8A8A8" font-size="15">clean layouts, clear hierarchy</text>
    </g>
    <g>
      <rect x="338" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="362" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Motion</text>
      <text x="362" y="160" fill="#A8A8A8" font-size="15">reveals, rhythm, micro states</text>
    </g>
    <g>
      <rect x="612" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="636" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Brand</text>
      <text x="636" y="160" fill="#A8A8A8" font-size="15">monochrome, premium systems</text>
    </g>
    <g>
      <rect x="886" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="910" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Delivery</text>
      <text x="910" y="160" fill="#A8A8A8" font-size="15">ship, test, refine, repeat</text>
    </g>
  </g>
</svg>
