<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Áreas de foco</title>
  <desc id="desc">Quatro áreas de foco: interface, movimento, marca e entrega.</desc>
  <rect width="1200" height="260" fill="#050505"/>
  <rect x="1" y="1" width="1198" height="258" stroke="#1C1C1C" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="57" fill="#777" font-size="12" letter-spacing="4">FOCOS SELECIONADOS</text>
    <g>
      <rect x="64" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="88" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Interface</text>
      <text x="88" y="160" fill="#A8A8A8" font-size="15">layouts limpos, hierarquia clara</text>
    </g>
    <g>
      <rect x="338" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="362" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Movimento</text>
      <text x="362" y="160" fill="#A8A8A8" font-size="15">revelações, ritmo, microestados</text>
    </g>
    <g>
      <rect x="612" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="636" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Marca</text>
      <text x="636" y="160" fill="#A8A8A8" font-size="15">monocromia, sistemas premium</text>
    </g>
    <g>
      <rect x="886" y="88" width="246" height="104" fill="#0B0B0B" stroke="#262626"/>
      <text x="910" y="128" fill="#F5F5F5" font-size="22" font-weight="700">Entrega</text>
      <text x="910" y="160" fill="#A8A8A8" font-size="15">criar, testar, refinar, repetir</text>
    </g>
  </g>
</svg>
